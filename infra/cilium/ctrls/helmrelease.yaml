apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: kube-system
  chart:
    spec:
      chart: cilium
      version: 1.20.2
      sourceRef:
        kind: HelmRepository
        name: cilium
  install:
    crds: Skip
    timeout: 10m
  upgrade:
    crds: Skip
    remediation:
      retries: 3
      strategy: rollback
  values:
    ipam:
      mode: kubernetes
    
    kubeProxyReplacement: true
    
    operator:
      replicas: 1
    
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    
    k8sServiceHost: localhost
    k8sServicePort: 7445
    
    l2announcements:
      enabled: true
    
    l2podAnnouncements:
      enabled: false
    
    externalIPs:
      enabled: true
    
    k8sClientRateLimit:
      qps: 20
      burst: 40
    
    gatewayAPI:
      enabled: true
      gatewayClass:
        create: true
    
    # The CA is pinned so a release reinstall never rotates the cluster CA.
    tls:
      ca:
        cert: 
        key: 
