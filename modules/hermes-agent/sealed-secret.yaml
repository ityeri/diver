apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hermes-agent-secret
  namespace: hermes-agent
spec:
  # 이건 values.yaml 로 렌더된 raw-manifests.yaml 에서 참조됨
  # raw-manifests.yaml 에서는 envFrom 참조라서 키 이름을 마음대로 바꿀수가 없음
  # values.yaml 에서 원하는 key 랑 env name 을 연결할 방법이 있는지는 모르겠음
  encryptedData:
    DEEPSEEK_API_KEY: 
    DISCORD_ALLOWED_USERS: 
    DISCORD_BOT_TOKEN: 
    DISCORD_HOME_CHANNEL: 
  template:
    metadata:
      name: hermes-agent-secret
      namespace: hermes-agent
