apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./namespace.yaml
  - ./raw-manifests.yaml
  - ./sealed-secret.yaml
  - ./workspace-vm/

patches:
  # Node affinity for hermes-agent deployment
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hermes-agent
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - node-00-k8scp
    target:
      kind: Deployment
      name: hermes-agent

  # Node affinity for workspace-vm
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hermes-workspace
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - node-00-k8scp
    target:
      kind: Deployment
      name: hermes-workspace

  # Discord secret value patch for hermes-agent raw manifests
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hermes-agent
      spec:
        template:
          spec:
            containers:
              - name: hermes-agent
                env:
                  - name: DISCORD_ALLOWED_USERS
                    $patch: delete
                  - name: DISCORD_HOME_CHANNEL
                    $patch: delete
    target:
      kind: Deployment
      name: hermes-agent
