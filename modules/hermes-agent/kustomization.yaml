apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hermes-agent

resources:
  - ./namespace.yaml
  - ./helmrelease.yaml
  - ./sealed-secret.yaml
  - ./workspace-vm/

patches:
  # Node affinity for workspace-vm
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hermes-workspace
      spec:
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values:
                            - node-00-k8scp
    target:
      kind: Deployment
      name: hermes-workspace
