# Source: hermes-agent/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  labels:
    helm.sh/chart: hermes-agent-0.1.0
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/instance: hermes-agent
    app.kubernetes.io/version: "0.8.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: hermes-agent
data:
  config.yaml: |
    agent:
      gateway_timeout: 1800
      max_turns: 90
      restart_drain_timeout: 60
      tool_use_enforcement: auto
    browser:
      allow_private_urls: false
      command_timeout: 30
      inactivity_timeout: 120
    compression:
      enabled: true
      protect_last_n: 20
      target_ratio: 0.2
      threshold: 0.5
    display:
      interim_assistant_messages: true
      tool_progress: all
    model:
      base_url: https://api.deepseek.com/v1
      default: deepseek-v4-flash
      provider: auto
    security:
      redact_secrets: true
      tirith_enabled: true
      tirith_fail_open: true
    terminal:
      backend: ssh
      cwd: /config/workspace
      ssh_host: hermes-workspace.hermes-agent.svc.cluster.local
      ssh_key: /run/secrets/workspace-ssh/id_ed25519
      ssh_port: 22
      ssh_user: agent
      timeout: 300
