apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    helm.sh/chart: hermes-agent-0.1.0
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/instance: hermes-agent
    app.kubernetes.io/version: "0.8.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: hermes-agent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/instance: hermes-agent
  template:
    metadata:
      labels:
        helm.sh/chart: hermes-agent-0.1.0
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/instance: hermes-agent
        app.kubernetes.io/version: "0.8.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: hermes-agent
      annotations:
        checksum/config: 478357297ba735cf617870f7a39add04f9a09bf3a083bb83596f0306ce215cc5
    spec:
      serviceAccountName: hermes-agent
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-config
          image: "nousresearch/hermes-agent:0.8.0"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              mkdir -p "/opt/data/home"
              if [ -f "/bootstrap/config.yaml" ]; then
                if [ "true" = "true" ] || [ ! -f "/opt/data/config.yaml" ]; then
                  cp "/bootstrap/config.yaml" "/opt/data/config.yaml"
                fi
              fi
              if [ -f "/bootstrap/SOUL.md" ]; then
                if [ "true" = "true" ] || [ ! -f "/opt/data/SOUL.md" ]; then
                  cp "/bootstrap/SOUL.md" "/opt/data/SOUL.md"
                fi
              fi
          env:
            - name: HERMES_HOME
              value: "/opt/data"
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: hermes-agent
          image: "nousresearch/hermes-agent:0.8.0"
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - run
          workingDir: /opt/hermes
          env:
            - name: HERMES_HOME
              value: "/opt/data"
            - name: HOME
              value: "/opt/data/home"
            - name: DISCORD_ALLOWED_USERS
              value: "Referenced from sealed_secret.yaml"
            - name: DISCORD_HOME_CHANNEL
              value: "Referenced from sealed_secret.yaml"
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "false"
            - name: HERMES_HUMAN_DELAY_MAX_MS
              value: "2500"
            - name: HERMES_HUMAN_DELAY_MIN_MS
              value: "800"
            - name: HERMES_HUMAN_DELAY_MODE
              value: "off"
            - name: IMAGE_TOOLS_DEBUG
              value: "false"
            - name: MOA_TOOLS_DEBUG
              value: "false"
            - name: SIGNAL_ALLOWED_USERS
              value: ""
            - name: SIGNAL_GROUP_ALLOWED_USERS
              value: ""
            - name: SLACK_ALLOWED_USERS
              value: ""
            - name: TELEGRAM_ALLOWED_USERS
              value: ""
            - name: TELEGRAM_HOME_CHANNEL
              value: ""
            - name: VISION_TOOLS_DEBUG
              value: "false"
            - name: WEB_TOOLS_DEBUG
              value: "false"
            - name: WHATSAPP_ALLOWED_USERS
              value: ""
            - name: WHATSAPP_ENABLED
              value: "false"
          envFrom:
            - secretRef:
                name: hermes-agent-secrets
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
            - mountPath: /run/secrets/workspace-ssh
              name: workspace-ssh-key
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: bootstrap
          configMap:
            name: hermes-agent-config
        - name: tmp
          emptyDir: {}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "1Gi"
        - name: workspace-ssh-key
          secret:
            defaultMode: 384
            items:
            - key: id_ed25519
              path: id_ed25519
            secretName: hermes-workspace-ssh
      terminationGracePeriodSeconds: 120
