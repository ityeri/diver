apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: route-je
  namespace: minegate
spec:
  parentRefs:
    - name: central-gateway
      namespace: infra
      sectionName: minegate-je
  rules:
    - backendRefs:
        - name: minegate
          kind: Service
          port: 25565
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: route-be
  namespace: minegate
spec:
  parentRefs:
    - name: central-gateway
      namespace: infra
      sectionName: minegate-be
  rules:
    - backendRefs:
        - name: minegate
          kind: Service
          port: 19132
