apiVersion: v1
kind: Service
metadata:
  name: lwyd-front
  namespace: lwyd
  labels:
    app.kubernetes.io/name: lwyd-front
  annotations:
    io.cilium/lb-ipam-ips: 10.0.0.199
    lbipam.cilium.io/sharing-key: public-vip
    lbipam.cilium.io/sharing-cross-namespace: "*"
spec:
  type: LoadBalancer
  selector:
    app: lwyd-front
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
