apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lwyd
  namespace: lwyd
spec:
  parentRefs:
    - name: central-gateway
      namespace: default
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - seena.cc
  rules:
    - backendRefs:
        - name: lwyd-front
          kind: Service
          port: 3000
