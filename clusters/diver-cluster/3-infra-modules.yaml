apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-modules
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium-config
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/modules
  # prune stays off until the HelmRelease cutover is verified
  prune: false
  wait: true
