apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: image-watch
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: image-watch
subjects:
  - kind: ServiceAccount
    name: image-watch
    namespace: image-watch
roleRef:
  kind: ClusterRole
  name: image-watch
  apiGroup: rbac.authorization.k8s.io
